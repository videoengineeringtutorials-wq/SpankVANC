[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "spankvanc"
version = "0.12.1"
description = "DeckLink-focused ANC/VANC routing and caption control"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
spankvanc = "spankvanc.__main__:main"

[tool.setuptools.package-data]
spankvanc = ["web/*"]

[tool.setuptools.packages.find]
include = ["spankvanc*"]
