name: App-only release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to package (for example v0.6.0)
        required: true
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Match tag to application version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os,tomllib
          from spankvanc import __version__
          assert os.environ['RELEASE_TAG'] == 'v'+__version__
          assert tomllib.load(open('pyproject.toml','rb'))['project']['version'] == __version__
          PY
      - name: Install media test dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg g++ pkg-config libavformat-dev libavcodec-dev libavutil-dev
      - name: Test source
        run: python -m unittest discover -s tests -v
      - name: Package app and source (no media engine)
        run: |
          python tools/package_source.py
          python tools/package_windows.py
          python tools/check_release_assets.py releases/*.zip
      - name: Create draft prerelease for review
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          gh release create "$RELEASE_TAG" releases/*.zip releases/*.sha256 --verify-tag --draft --prerelease --title "SpankVANC $RELEASE_TAG" --notes-file CHANGELOG.md
